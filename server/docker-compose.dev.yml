services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: go_backend

    ports:
      - "8080:8080"

    environment:
      DATABASE_URL: postgresql://myuser:mypassword@postgres:5432/mydatabase
      PYTHON_URL: http://python_service:8000
      WORKER_URL: ${WORKER_URL:-http://python_service:8000}
      QSTASH_URL: ${QSTASH_URL:-https://qstash.upstash.io/v2/publish}
      QSTASH_TOKEN: ${QSTASH_TOKEN:-}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-token}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}

    depends_on:
      postgres:
        condition: service_healthy
      python_service:
        condition: service_healthy

    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: unless-stopped

    networks:
      - app_network


  postgres:
    image: postgres:17-alpine
    container_name: cur_dev_db

    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydatabase

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydatabase"]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

    networks:
      - app_network


  python_service:
    build:
      context: ../python
      dockerfile: Dockerfile.prod
    container_name: python_service

    ports:
      - "8000:8000"

    env_file:
      - ../python/app/.env

    environment:
      DATABASE_URL: postgresql://myuser:mypassword@postgres:5432/mydatabase
      GATEWAY_URL: http://backend:8080
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-token}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-45}
      CHROMA_COLLECTION: ${CHROMA_COLLECTION:-curriculum_sources_v1}

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6

    restart: unless-stopped

    networks:
      - app_network


volumes:
  postgres_data:


networks:
  app_network:
